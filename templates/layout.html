{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:image" content="https://hest.lol/static/hest.jpg" />
    <meta property="og:title" content="🐴" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hest.lol/" />
    <title>{{.Title}}</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.counter.dev/script.js" data-id="4095a605-a908-4fd5-bf8f-5900185e9a73" data-utcoffset="1"></script>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="icon" href="/static/favicon.svg" />
  </head>
  <body>
    <div class="container">
      <nav class="nav">
        <span id="horse-icon" style="cursor: pointer;">🐴</span>
        <a href="/{{if .SeasonExplicit}}?season={{.SeasonID}}{{end}}" {{if eq .Path "/"}}class="active"{{end}}>Stilling</a>
        <a href="/games{{if .SeasonExplicit}}?season={{.SeasonID}}{{end}}" {{if eq .Path "/games"}}class="active"{{end}}>Kampe</a>
        <a href="/h2h{{if .SeasonExplicit}}?season={{.SeasonID}}{{end}}" {{if eq .Path "/h2h"}}class="active"{{end}}>H2H</a>
        <div class="nav-right">
          <form class="season-filter" aria-label="Sæson filter">
            <label class="season-label">
              <span class="sr-only">Sæson</span>
              <select id="season-filter" name="season">
                <option value="0" {{if eq .SeasonID 0}}selected{{end}}>Alle sæsoner</option>
                {{range .Seasons}}
                <option value="{{.ID}}" {{if eq $.SeasonID .ID}}selected{{end}}>
                  {{.Name}}
                </option>
                {{end}}
              </select>
            </label>
          </form>
          <a href="/new{{if .SeasonExplicit}}?season={{.SeasonID}}{{end}}" class="{{if eq .Path "/new"}}active{{end}}">Tilføj kamp</a>
        </div>
      </nav>
      <audio id="horse-sound" preload="auto">
        <source src="/static/hest.mp3" type="audio/mpeg">
      </audio>
      <main class="card">{{template "content" .}}</main>
      <footer class="footer">
        <span><a href="/rules">Regler</a></span>
        <span class="footer-sep">|</span>
        <span><a href="/shortcuts">Genveje</a></span>
        <span class="footer-sep">|</span>
        <span><a href="https://github.com/martinohansen/hest">GitHub</a></span>
        <span class="footer-version">{{version}}</span>
      </footer>
    </div>
    <script>
      // Fire Horse year easter egg — 丙午 occurs every 60 years: 1906, 1966,
      // 2026 etc. On click, toggles the horse icon to 🔥 (and back).
      const isFireHorseYear = (new Date().getFullYear() - 1906) % 60 === 0;
      let fireHorseActive = false;

      // Easter egg: Track horse clicks
      let horseClickCount = 0;
      let horseClickTimeout = null;

      document.addEventListener("click", function (event) {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        // Horse sound, fire reveal, and roll
        if (target.id === "horse-icon") {
          const audio = document.getElementById("horse-sound");
          if (audio) {
            audio.volume = 0.5;
            audio.currentTime = 0;
            audio.play();
          }

          if (isFireHorseYear) {
            const icon = document.getElementById("horse-icon");
            fireHorseActive = !fireHorseActive;
            icon.textContent = fireHorseActive ? "🔥" : "🐴";
          }

          // Horse roll
          horseClickCount++;
          if (horseClickTimeout) {
            clearTimeout(horseClickTimeout);
          }
          horseClickTimeout = setTimeout(function() {
            horseClickCount = 0;
          }, 2000);
          if (horseClickCount >= 3) {
            horseClickCount = 0;
            document.body.classList.add("page-roll");
            setTimeout(function() {
              document.body.classList.remove("page-roll");
            }, 2000);
          }

          return;
        }

        // Select all players
        if (target.id !== "select-all-players") return;
        const list = document.getElementById("player-list");
        if (!list) return;
        list
          .querySelectorAll('input[type="checkbox"][name="player_id"]')
          .forEach(function (cb) {
            cb.checked = true;
          });
      });

      // H2H shift-pick: hold Shift to enter picking mode, click a row to
      // select player 1 (emoji → ⚔️), click another row to go to /h2h.
      // Escape or releasing Shift (before picking) cancels.
      (function () {
        let selectedId = null;
        let selectedRow = null;

        function getTable() {
          return document.getElementById("leaderboard");
        }

        function enterPickingMode() {
          const t = getTable();
          if (t) t.classList.add("h2h-picking");
        }

        function exitPickingMode() {
          const t = getTable();
          if (t) t.classList.remove("h2h-picking");
          if (selectedRow) selectedRow.classList.remove("h2h-selected");
          selectedId = null;
          selectedRow = null;
        }

        document.addEventListener("keydown", function (e) {
          if (e.key === "Shift" && !e.repeat) enterPickingMode();
          if (e.key === "Escape") exitPickingMode();
        });

        document.addEventListener("keyup", function (e) {
          if (e.key === "Shift") exitPickingMode();
        });

        document.addEventListener("click", function (e) {
          const t = getTable();
          if (!t || !t.classList.contains("h2h-picking")) return;

          const row = e.target.closest("#leaderboard tbody tr[data-player-id]");
          if (!row) return;

          // Require shift to make the first pick; second pick works without it
          if (!selectedId && !e.shiftKey) return;

          e.preventDefault();
          const id = row.dataset.playerId;

          if (!selectedId) {
            selectedId = id;
            selectedRow = row;
            row.classList.add("h2h-selected");
          } else if (id === selectedId) {
            // Click same row again = deselect
            row.classList.remove("h2h-selected");
            selectedId = null;
            selectedRow = null;
          } else {
            const params = new URLSearchParams(window.location.search);
            const season = params.get("season");
            let url = "/h2h?player1=" + selectedId + "&player2=" + id;
            if (season) url += "&season=" + encodeURIComponent(season);
            window.location.href = url;
          }
        });
      })();

      const seasonSelect = document.getElementById("season-filter");
      if (seasonSelect) {
        seasonSelect.addEventListener("change", function () {
          const url = new URL(window.location.href);
          const value = seasonSelect.value || "0";
          url.searchParams.set("season", value);
          window.location.href = url.toString();
        });
      }
    </script>
  </body>
</html>
{{end}}
