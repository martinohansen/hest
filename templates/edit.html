{{define "content"}}
<div class="stack">
  <h1>Rediger kamp #{{.GameID}}</h1>
  {{if .Error}}
  <p class="error">{{.Error}}</p>
  {{end}}

  <form action="/game/update" method="post" class="stack">
    <input type="hidden" name="game_id" value="{{.GameID}}" />
    {{if .SeasonExplicit}}
    <input type="hidden" name="season" value="{{.SeasonID}}" />
    {{end}}

    <label class="stack">
      <span>Dato</span>
      <input type="date" name="played_at" value="{{.PlayedAt}}" />
    </label>

    <div class="stack">
      <p>Klik på en spiller for at sætte placering:</p>
      <div class="list" id="placement-list">
        {{range .Players}}
        <div class="list-item placement-badge" data-player-id="{{.ID}}" tabindex="0" role="button">
          <input type="checkbox" name="player_id" value="{{.ID}}" {{if .Selected}}checked{{end}} onclick="event.stopPropagation()" />
          <span>{{.Emoji}}</span>
          <span class="placement-name">{{.Name}}</span>
          <span class="badge-rank-icon"></span>
        </div>
        {{end}}
      </div>
      <input type="hidden" name="winner_id" id="input-winner-id" value="{{if .WinnerID}}{{.WinnerID}}{{end}}" />
      <input type="hidden" name="second_id" id="input-second-id" value="{{if .SecondID}}{{.SecondID}}{{end}}" />
    </div>

    <div class="actions">
      <button type="submit">Gem ændringer</button>
    </div>
  </form>
</div>
<script>
(function () {
  var list = document.getElementById("placement-list");
  if (!list) return;
  var winnerInput = document.getElementById("input-winner-id");
  var secondInput = document.getElementById("input-second-id");
  var states = {};

  function updateBadge(badge, state) {
    var icon = badge.querySelector(".badge-rank-icon");
    badge.classList.remove("placement-badge--winner", "placement-badge--second");
    if (state === 1) {
      badge.classList.add("placement-badge--winner");
      icon.textContent = "🥇";
    } else if (state === 2) {
      badge.classList.add("placement-badge--second");
      icon.textContent = "🥈";
    } else {
      icon.textContent = "";
    }
  }

  list.querySelectorAll(".placement-badge").forEach(function (badge) {
    var id = badge.dataset.playerId;
    var initWinner = winnerInput ? winnerInput.value : "";
    var initSecond = secondInput ? secondInput.value : "";
    var state = 0;
    if (id === initWinner && initWinner && initWinner !== "0") state = 1;
    if (id === initSecond && initSecond && initSecond !== "0") state = 2;
    states[id] = state;
    updateBadge(badge, state);

    function handleActivate() {
      var current = states[id] || 0;
      if (current === 1) {
        states[id] = 0;
        if (winnerInput) winnerInput.value = "";
        updateBadge(badge, 0);
      } else if (current === 2) {
        states[id] = 0;
        if (secondInput) secondInput.value = "";
        updateBadge(badge, 0);
      } else {
        var winnerTaken = Object.keys(states).some(function (k) { return states[k] === 1; });
        if (!winnerTaken) {
          states[id] = 1;
          if (winnerInput) winnerInput.value = id;
          updateBadge(badge, 1);
        } else {
          var secondTaken = Object.keys(states).some(function (k) { return states[k] === 2; });
          if (!secondTaken) {
            states[id] = 2;
            if (secondInput) secondInput.value = id;
            updateBadge(badge, 2);
          }
        }
      }
    }

    badge.addEventListener("click", handleActivate);
    badge.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        handleActivate();
      }
    });
  });
})();
</script>
{{end}}
