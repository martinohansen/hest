[Service]
# Keep the database writable while making the rest of the host read-only.
ProtectSystem=strict
ReadWritePaths=/opt/hest

# The service needs outbound IP access for weather lookups and a Unix socket
# address family for normal runtime operation.
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6

NoNewPrivileges=true
PrivateDevices=true
PrivateTmp=true
ProtectClock=true
ProtectControlGroups=true
ProtectHome=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
RemoveIPC=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
